# /etc/sdr-slc/rtld.conf - arguments for the sdr-slc-rtld systemd unit.
#
# The daemon speaks SDR-SLC-CP-1.0 Release 1.3 and SDR-SLC-VITA-1.0 Release
# 1.2 and advertises one function block, rx, at Tier 2. Authentication is
# OFF by default: a receiver has no particular reason for it (§26). Turn it
# on with --rx-auth psk, generate a key with
#
#     sudo sdr-slc-rtld keygen
#
# and enter the printed key_id and psk in the client. The key file is
# /etc/sdr-slc/rtld.keys, same layout as bladerfd.keys.

SLC_ARGS=-v

# Require a pre-shared key for every command that addresses rx:
# SLC_ARGS=-v --rx-auth psk

# HF via direct sampling on the Q branch (RTL-SDR v3/v4), with the bias tee
# on at startup for a masthead LNA that must stay powered between clients
# (a documented deviation from §13.3, logged as such):
# SLC_ARGS=-v --direct-q --bias-tee-persist

# Publish through avahi-daemon instead of the builtin responder (only in a
# binary built with make MDNS=avahi):
# SLC_ARGS=-v --mdns avahi

# Fixed instance name instead of SLC-XXYYZZ from the MAC of the first
# interface with a hardware address (or of -i IFACE):
# SLC_ARGS=-v --name SLC-shack-rtl

# u8 zero point: the ADC code that is zero signal, declared to the client as
# iq_formats[].zero_point. 127.4 is the RTL2832U midpoint; a dongle that
# still shows a spike at the capture centre can be measured (mean of the raw
# stream with the input terminated) and set here:
# SLC_ARGS=-v --u8-zero-point 127.35

# Reference Level calibration is a compile-time constant on this daemon
# (RTL_REF_LEVEL_DBM_AT_0DB in config.h, nominal -10 dBm for a stock R820T2).
